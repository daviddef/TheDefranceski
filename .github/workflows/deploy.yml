name: Build and deploy the archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
        working-directory: site
      # The linking standard's gate proves itself before it is trusted (the kit's self-test plants a fault for every rule and a control
      # for each), then runs inside `npm run build` as its last step. CI has no GEDCOM and no tree: the gate reads only the committed
      # roster (through the names index and living list that `npm run autolink` writes), the committed config and ratchet, and inputs
      # rebuilt from committed data (scripts/build-standard-inputs.py, scripts/build-records.py --check).
      - name: Self-test of the linking standard's gate
        run: npm run check:standard-selftest
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
